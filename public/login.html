<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Elite Run Club</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "primary": "#00336e",
          "on-primary": "#ffffff",
          "surface": "#f7f9fb",
          "surface-container-low": "#f2f4f6",
          "surface-container": "#eceef0",
          "on-surface": "#191c1e",
          "on-surface-variant": "#434750",
          "outline": "#747781",
          "outline-variant": "#c3c6d1",
          "background": "#f7f9fb"
        },
        "borderRadius": {
          "DEFAULT": "0.25rem",
          "lg": "0.5rem",
          "xl": "0.75rem",
          "full": "9999px"
        }
      }
    }
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .ambient-shadow { box-shadow: 0 10px 30px -10px rgba(36, 74, 134, 0.08); }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">

<nav class="w-full top-0 sticky z-50 bg-surface shadow-sm">
  <div class="flex justify-center items-center px-4 py-4 max-w-7xl mx-auto">
    <a href="/" class="font-bold text-primary text-xl flex items-center gap-2">Elite Run Club</a>
  </div>
</nav>

<main class="flex-1 flex items-center justify-center px-4">
  <div class="bg-surface-container-low rounded-xl ambient-shadow p-8 md:p-10 max-w-md w-full text-center">
    <h1 class="text-2xl font-bold text-primary mb-2">Welcome back</h1>
    <p class="text-on-surface-variant mb-8">Log in to register for runs, track your history, and manage your profile.</p>

    <a href="/api/auth/google"
       class="w-full flex items-center justify-center gap-3 bg-white border border-outline-variant rounded-lg py-3 px-4 font-semibold text-on-surface hover:bg-surface-container transition-colors">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.7 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.2 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.2 29.5 4 24 4c-7.7 0-14.3 4.4-17.7 10.7z"/>
        <path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.3l-6.3-5.3C29.4 35.4 26.8 36 24 36c-5.4 0-9.9-3.3-11.3-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.7l6.3 5.3C39.9 37 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/>
      </svg>
      Sign in with Google
    </a>

    <p class="text-sm text-on-surface-variant mt-6">
      By continuing, you agree to join Elite Run Club's community.
    </p>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  // If someone who's already logged in visits this page, send them to their profile
  (async () => {
    const user = await checkAuth();
    if (user) window.location.href = "/profile";
  })();
</script>
</body>
</html>
