<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Contact Us | Elite Run Club</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "primary": "#00336e","on-primary": "#ffffff","surface": "#f7f9fb",
          "surface-container-low": "#f2f4f6","surface-container-lowest": "#ffffff",
          "on-surface": "#191c1e","on-surface-variant": "#434750",
          "outline-variant": "#c3c6d1","background": "#f7f9fb"
        }
      }
    }
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">

<nav class="w-full top-0 sticky z-50 bg-surface shadow-sm">
  <div class="flex justify-between items-center px-4 md:px-16 py-4 max-w-7xl mx-auto">
    <a href="/" class="font-bold text-primary text-xl">Elite Run Club</a>
    <div class="hidden lg:flex items-center gap-8 text-sm font-medium text-on-surface-variant">
      <a href="/" class="hover:text-primary">Home</a>
      <a href="/events" class="hover:text-primary">Runs &amp; Events</a>
      <a href="/community" class="hover:text-primary">Community</a>
      <a href="/contact" class="text-primary">Contact</a>
    </div>
  </div>
</nav>

<main class="flex-1 max-w-2xl mx-auto px-4 py-16 w-full">
  <h1 class="text-3xl font-bold text-on-surface mb-2 text-center">Get in Touch</h1>
  <p class="text-on-surface-variant text-center mb-10">Questions, feedback, or want to partner with us? Send us a message.</p>

  <form id="contact-form" class="bg-surface-container-lowest border border-outline-variant/40 rounded-2xl p-8 space-y-5">
    <div>
      <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Your Name</label>
      <input id="contact-name" type="text" required class="w-full border border-outline-variant rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary bg-surface">
    </div>
    <div>
      <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Email Address</label>
      <input id="contact-email" type="email" required class="w-full border border-outline-variant rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary bg-surface">
    </div>
    <div>
      <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Message</label>
      <textarea id="contact-message" required rows="5" minlength="10" maxlength="2000"
        class="w-full border border-outline-variant rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary bg-surface resize-none"></textarea>
    </div>
    <button id="contact-submit" type="submit" class="w-full bg-primary text-on-primary rounded-full py-3 font-semibold hover:shadow-lg transition-all">
      Send Message
    </button>
    <p id="contact-msg" class="text-sm text-center"></p>
  </form>
</main>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
document.getElementById('contact-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = document.getElementById('contact-name').value.trim();
  const email = document.getElementById('contact-email').value.trim();
  const message = document.getElementById('contact-message').value.trim();
  const msg = document.getElementById('contact-msg');
  const btn = document.getElementById('contact-submit');

  btn.disabled = true;
  btn.textContent = 'Sending…';
  msg.textContent = '';

  try {
    await apiPost('/api/contact', { name, email, message });
    msg.style.color = '#00336e';
    msg.textContent = "Message sent! We'll get back to you soon.";
    document.getElementById('contact-form').reset();
    btn.textContent = 'Send Message';
    btn.disabled = false;
  } catch (err) {
    msg.style.color = 'red';
    msg.textContent = err.message;
    btn.textContent = 'Send Message';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
